          background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:white;padding:6px 12px 6px 6px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;
        }
        .user-chip .avatar{width:28px;height:28px;background:var(--gotg-red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

        /* Demo banner */
        .demo-banner{
          background:var(--gotg-charcoal);color:#d6d3cf;font-size:12.5px;padding:8px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.06);
        }
        .demo-banner strong{color:white;}
        .demo-banner code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;font-size:11.5px;}

        /* Buttons */
        .btn-gotg{
          background:var(--gotg-red);color:white;border:none;border-radius:999px;padding:12px 28px;font-family:"Plus Jakarta Sans";font-weight:700;font-size:14px;letter-spacing:.02em;transition:all .22s;box-shadow:0 6px 16px rgba(200,16,46,.25);
        }
        .btn-gotg:hover{background:var(--gotg-red-dark);transform:translateY(-2px);box-shadow:0 10px 24px rgba(200,16,46,.35);color:white;}
        .btn-outline-light{border:1.5px solid rgba(255,255,255,.6);color:white;border-radius:999px;padding:11px 26px;font-family:"Plus Jakarta Sans";font-weight:600;background:transparent;transition:.2s;}
        .btn-outline-light:hover{background:white;color:var(--gotg-ink);border-color:white;transform:translateY(-1px);}

        /* Hero */
        .hero{
          background:linear-gradient(115deg,var(--gotg-ink) 0%, #2a1216 55%, var(--gotg-red-dark) 100%);
          position:relative;overflow:hidden;color:white;padding:88px 0 92px;
        }
        .hero:before{
          content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);background-size:22px 22px;opacity:.55;pointer-events:none;
        }
        .hero .pill{
          background:rgba(200,16,46,.18);border:1px solid rgba(200,16,46,.35);color:#ffb3c0;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;
        }
        .hero .pill span{width:6px;height:6px;background:#ff4d6a;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(255,77,106,.2);animation:pulse 1.6s infinite;}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,106,.4)}70%{box-shadow:0 0 0 6px rgba(255,77,106,0)}100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}}

        /* Stat card */
        .stat-card{
          background:var(--gotg-sand);border-radius:18px;padding:22px 22px 18px;border:1px solid #ece8e1;transition:transform .22s, box-shadow .22s;
        }
        .stat-card:hover{transform:translateY(-4px);box-shadow:0 18px 32px rgba(0,0,0,.08);}
        .stat-card .num{font-family:"Plus Jakarta Sans";font-weight:800;font-size:28px;letter-spacing:-0.02em;}
        .stat-card .label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8a8680;margin-top:4px;}

        /* Project card */
        .project-card{
          background:white;border-radius:20px;border:1px solid #ece8e1;overflow:hidden;transition:transform .22s, box-shadow .22s;height:100%;
        }
        .project-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.08);}
        .project-card .status-badge{
          background:rgba(224,168,13,.15);color:#8a6a00;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:inline-block;
        }
        .project-card .status-badge.active{background:rgba(34,197,94,.12);color:#166534;}
        .project-card .status-badge.completed{background:rgba(59,130,246,.12);color:#1e40af;}

        .section{padding:84px 0;}
        .section-sand{background:var(--gotg-sand);padding:84px 0;}
        .eyebrow{color:var(--gotg-red);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:12px;}

        .icon-badge{
          width:52px;height:52px;border-radius:14px;background:rgba(200,16,46,.10);display:flex;align-items:center;justify-content:center;color:var(--gotg-red);flex-shrink:0;
        }

        .form-panel{
          background:white;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.1);padding:32px;border:1px solid #f0ede8;
        }
        .auth-wrap{min-height:calc(100vh - 140px);background:var(--gotg-sand);display:flex;align-items:center;padding:40px 0;}
        .form-control,.form-select{
          border-radius:12px!important;border:1.5px solid #e3e0da!important;padding:11px 14px!important;font-size:14.5px!important;transition:.2s!important;
        }
        .form-control:focus,.form-select:focus{
          border-color:var(--gotg-red)!important;box-shadow:0 0 0 .2rem rgba(200,16,46,.15)!important;
        }
        .form-label{font-weight:600;font-size:13px;color:#3a3a3a;margin-bottom:6px;}

        .dash-header{background:var(--gotg-ink);color:white;padding:28px 0 24px;border-bottom:4px solid var(--gotg-red);}
        .table-card{background:white;border-radius:18px;border:1px solid #ece8e1;overflow:hidden;}
        .table-card .card-head{background:var(--gotg-charcoal);color:white;padding:14px 18px;font-family:"Plus Jakarta Sans";font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
        .gotg-footer{background:var(--gotg-ink);color:#b8b5b1;padding:56px 0 28px;border-top:4px solid var(--gotg-red);}

        .reveal{opacity:0;transform:translateY(18px);transition:all .7s cubic-bezier(.2,.8,.2,1);}
        .reveal.is-visible{opacity:1;transform:translateY(0);}
        .reveal.d1{transition-delay:.08s}
        .reveal.d2{transition-delay:.16s}
        .reveal.d3{transition-delay:.24s}

        /* Certificate */
        .cert-paper{
          background:white;border:1px solid #e8e2d9;box-shadow:0 18px 48px rgba(0,0,0,.12);border-radius:4px;position:relative;overflow:hidden;
        }
        .cert-paper:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--gotg-red);}
        .cert-watermark{position:absolute;right:-20px;top:50%;transform:translateY(-50%) rotate(-12deg);font-family:"Plus Jakarta Sans";font-weight:900;font-size:88px;color:rgba(200,16,46,.06);pointer-events:none;letter-spacing:-4px;}

        @media(max-width:768px){
          .hero{padding:56px 0 64px;}
          .section,.section-sand{padding:48px 0;}
          .form-panel{padding:22px;}
        }
